name: Sync New Grad SWE Jobs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run jobs_sync.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python3 Vercel/jobs_sync.py
      - name: Commit Vercel/data/ (read by the Cowork sync routine)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Vercel/data/
          git diff --cached --quiet || git commit -m "chore: update jobs data snapshot [skip ci]"
          git push
