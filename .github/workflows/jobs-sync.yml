name: Sync New Grad SWE Jobs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run jobs_sync.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python3 Vercel/jobs_sync.py
