name: Job Application Tracker

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_backfill:
        description: "Force a full 90-day backfill scan"
        required: false
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            google-genai \
            google-generativeai
      - name: Run application tracker agent
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "0155252da48c020d0fadb9fdc5e43c2d"
          FORCE_BACKFILL: ${{ inputs.force_backfill || 'false' }}
        run: python3 Vercel/agents/job_tracker/applications_agent.py
